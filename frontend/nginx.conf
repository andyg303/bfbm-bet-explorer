server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history mode support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE endpoint for ingest — no buffering, long timeout
    location /api/ingest {
        client_max_body_size 50M;
        proxy_pass http://backend:8000/ingest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE requires no buffering and HTTP/1.1
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;

        # Long timeout for large file processing (10 minutes)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Proxy API requests to the backend
    location /api/ {
        client_max_body_size 50M;
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
