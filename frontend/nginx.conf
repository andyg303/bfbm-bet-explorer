server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://checkout.stripe.com https://api.stripe.com; frame-src https://checkout.stripe.com https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;
    # HSTS — uncomment after verifying HTTPS works:
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Hide nginx version
    server_tokens off;

    # Vue Router history mode support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE endpoint for ingest — no buffering, long timeout
    location /api/ingest {
        client_max_body_size 50M;
        proxy_pass http://backend:8000/ingest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE requires no buffering and HTTP/1.1
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;

        # Long timeout for large file processing (10 minutes)
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # recalculate-commission can be slow for large bet histories — give it 10 minutes
    location /api/recalculate-commission {
        proxy_pass http://backend:8000/recalculate-commission;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # Scheduled uploader can take a while on big CSVs, so give it the same
    # long timeout used by the interactive ingest flow.
    location /api/automation/ingest {
        client_max_body_size 50M;
        proxy_pass http://backend:8000/automation/ingest;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # Proxy API requests to the backend
    location /api/ {
        client_max_body_size 50M;
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow heavier analytical endpoints (monthly-pl, odds-bands-profit, etc.)
        # to run for up to 5 minutes before nginx returns a 504. The default 60s
        # was being hit on accounts with very large bet histories.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
